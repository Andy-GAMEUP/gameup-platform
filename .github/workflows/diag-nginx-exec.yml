name: Diag Nginx Exec

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, gameup-prod]
    timeout-minutes: 2
    steps:
      - name: quick exec test
        run: |
          echo "1) 컨테이너 목록"
          docker ps --format "{{.Names}} {{.Status}}"
          echo "2) 간단 echo 테스트"
          timeout 10 docker exec gameup-nginx echo hello || echo "echo 테스트 실패/타임아웃"
          echo "3) access.log 존재 확인"
          timeout 10 docker exec gameup-nginx ls -la /var/log/nginx/ || echo "ls 실패/타임아웃"
          echo "4) access.log 크기"
          timeout 10 docker exec gameup-nginx wc -l /var/log/nginx/access.log || echo "wc 실패/타임아웃"
